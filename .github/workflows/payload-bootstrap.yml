name: Payload Bootstrap Artifacts

on:
  push:
    branches: [feat/payload-cms-foundation]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ivumz_home
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ivumz_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/ivumz_home
      PAYLOAD_ALLOWED_ORIGINS: http://127.0.0.1:3000
      PAYLOAD_PUBLIC_SERVER_URL: http://127.0.0.1:3000
      PAYLOAD_SECRET: ci-bootstrap-only-secret-not-for-production-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm generate:types
      - run: pnpm generate:importmap
      - run: pnpm payload migrate:create initial_payload_foundation --force-accept-warning
      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml src/payload-types.ts src/migrations 'src/app/(payload)/admin/importMap.js'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: generate Payload artifacts"
          git push
