name: Content Model Generate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ivmz_home
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ivmz_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/ivmz_home
      PAYLOAD_ALLOWED_ORIGINS: http://127.0.0.1:3000
      PAYLOAD_PUBLIC_SERVER_URL: http://127.0.0.1:3000
      PAYLOAD_SECRET: ci-only-secret-not-for-production-2026-ivmz-home
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: guard
        name: Content Model migration生成済みか確認
        shell: bash
        run: |
          if compgen -G 'src/migrations/*_payload_content_model_foundation.ts' >/dev/null; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.generated == 'false'
        run: pnpm db:migrate
      - if: steps.guard.outputs.generated == 'false'
        run: pnpm db:migrate:create payload_content_model_foundation
      - if: steps.guard.outputs.generated == 'false'
        run: pnpm generate:types
      - if: steps.guard.outputs.generated == 'false'
        run: pnpm generate:importmap
      - if: steps.guard.outputs.generated == 'false'
        run: pnpm format
      - if: steps.guard.outputs.generated == 'false'
        name: generated Payload artifactsとformatをfeature branchへcommit
        shell: bash
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "Generated artifacts and formatting are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate Payload content model artifacts"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
