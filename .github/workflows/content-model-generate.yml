name: Content Model Generate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ivmz_home
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ivmz_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/ivmz_home
      PAYLOAD_ALLOWED_ORIGINS: http://127.0.0.1:3000
      PAYLOAD_PUBLIC_SERVER_URL: http://127.0.0.1:3000
      PAYLOAD_SECRET: ci-only-secret-not-for-production-2026-ivmz-home
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:migrate:create payload_content_model_foundation
      - run: pnpm generate:types
      - run: pnpm generate:importmap
      - uses: actions/upload-artifact@v4
        with:
          name: payload-content-model-generated
          path: |
            src/migrations
            src/payload-types.ts
            src/app/(payload)/admin/importMap.js
          if-no-files-found: error
