name: Temporary formatter diff (Issue 69)
on:
  push:
    branches:
      - feat/issue-69-anonymous-message-form
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only Issue 69 UI files
        run: pnpm exec prettier --write 'src/app/(site)/message/page.tsx' 'src/components/site/AnonymousMessageForm.test.tsx'
      - name: Print exact suggested diff for manual review
        run: git diff -- 'src/app/(site)/message/page.tsx' 'src/components/site/AnonymousMessageForm.test.tsx'
