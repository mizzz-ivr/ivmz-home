name: Format Diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier-diff:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        shell: bash
        run: |
          pnpm exec prettier --write 'src/app/(site)/page.tsx' 'src/components/site/SiteExperience.tsx' 'tests/e2e/home.spec.ts'
          git diff -- 'src/app/(site)/page.tsx' 'src/components/site/SiteExperience.tsx' 'tests/e2e/home.spec.ts'
          test -z "$(git status --porcelain -- 'src/app/(site)/page.tsx' 'src/components/site/SiteExperience.tsx' 'tests/e2e/home.spec.ts')"
