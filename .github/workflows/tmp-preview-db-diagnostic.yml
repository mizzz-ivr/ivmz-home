name: Temporary Preview DB Diagnostic

on:
  push:
    branches: [feat/payload-cms-foundation]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DIAGNOSTIC_URL: https://6a8e96435af9fd0008dce081--ivmz-home.netlify.app/preview-db-diagnostic
    steps:
      - name: TLS互換設定後のDeploy Previewを診断
        shell: bash
        run: |
          status="$(curl --location --max-time 30 --silent --show-error --output /tmp/db-diagnostic.json --write-out '%{http_code}' "$DIAGNOSTIC_URL" || true)"
          echo "HTTP_STATUS=$status"
          if [ "$status" = "200" ] || [ "$status" = "503" ]; then
            cat /tmp/db-diagnostic.json
            exit 0
          fi
          echo "診断routeが200/503を返しませんでした。"
          exit 1
