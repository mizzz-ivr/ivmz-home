name: Temporary Preview DB Diagnostic

on:
  push:
    branches: [feat/payload-cms-foundation]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DIAGNOSTIC_URL: https://6a8e7a1e4ca139000864a95e--ivmz-home.netlify.app/__diagnostics/db
    steps:
      - name: Ready済みDeploy Previewの接続文字列構造を診断
        shell: bash
        run: |
          status="$(curl --location --max-time 30 --silent --show-error --output /tmp/db-diagnostic.json --write-out '%{http_code}' "$DIAGNOSTIC_URL" || true)"
          echo "HTTP_STATUS=$status"
          if [ "$status" = "200" ]; then
            cat /tmp/db-diagnostic.json
            exit 0
          fi
          echo "診断routeが200を返しませんでした。"
          exit 1
