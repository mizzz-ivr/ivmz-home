name: Temporary ivmz rename

on:
  push:
    branches: [feat/payload-cms-foundation]

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payload-cms-foundation
      - name: 旧ivumz識別子をivmzへ機械的に置換
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('src/migrations/20260826_021855_initial_payload_foundation.json'),
              Path('docs/adr/0003-payload-postgres-foundation.md'),
              Path('docs/architecture.md'),
              Path('docs/payload-foundation.md'),
          ]
          replacements = [
              ('ivumz_home_app', 'ivmz_home_app'),
              ('ivumz_home', 'ivmz_home'),
              ('https://mizzz.ivrm.jp', 'https://ivmz.ivrm.jp'),
              ('ivumz-home', 'ivmz-home'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
      - name: 変更がある場合のみcommit
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/migrations/20260826_021855_initial_payload_foundation.json \
            docs/adr/0003-payload-postgres-foundation.md \
            docs/architecture.md \
            docs/payload-foundation.md
          git commit -m "chore: 生成物とFoundation文書をivmzへ統一"
          git push origin HEAD:feat/payload-cms-foundation
