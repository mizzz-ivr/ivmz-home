name: Netlify Preview Smoke

on:
  pull_request:
    branches: [main]
    # PR title edits alone must not trigger a new Preview/Smoke run.
    # During iteration, use [skip netlify]; remove it only after CI is green,
    # then create the final validation commit to get one exact-head Preview.
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve-preview:
    if: ${{ !contains(github.event.pull_request.title, '[skip netlify]') && !contains(github.event.pull_request.title, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.preview.outputs.head_sha }}
      pr_number: ${{ steps.preview.outputs.pr_number }}
    steps:
      - name: Deploy Preview targetを解決
        id: preview
        shell: bash
        run: |
          echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

  preview-smoke:
    needs: resolve-preview
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://deploy-preview-${{ needs.resolve-preview.outputs.pr_number }}--ivmz-home.netlify.app
      NETLIFY_STATUS_CONTEXT: netlify/ivmz-home/deploy-preview
      PREVIEW_HEAD_SHA: ${{ needs.resolve-preview.outputs.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: 対象commitのDeploy Preview完了を待機
        shell: bash
        run: |
          for attempt in {1..40}; do
            state="$(
              curl --fail --silent --show-error \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$PREVIEW_HEAD_SHA/status" \
                | jq -r --arg context "$NETLIFY_STATUS_CONTEXT" \
                  '[.statuses[] | select(.context == $context)][0].state // "missing"'
            )"

            case "$state" in
              success)
                break
                ;;
              failure|error)
                echo "Deploy Previewが失敗しました: commit=$PREVIEW_HEAD_SHA state=$state"
                exit 1
                ;;
            esac

            if [[ "$attempt" -eq 40 ]]; then
              echo "対象commitのDeploy Preview完了を確認できませんでした: commit=$PREVIEW_HEAD_SHA state=$state"
              exit 1
            fi

            sleep 15
          done

          curl --fail --silent --show-error --location --head "$E2E_BASE_URL" >/dev/null
      - name: Payload public API preflight
        shell: bash
        run: |
          response_file="$(mktemp)"
          set +e
          status="$(
            curl --silent --show-error --location \
              --connect-timeout 10 \
              --max-time 60 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$E2E_BASE_URL/api/works?limit=1"
          )"
          curl_exit=$?
          set -e

          if [[ "$curl_exit" -ne 0 ]]; then
            echo "Payload public API preflight request failed: curl_exit=$curl_exit status=$status"
            head -c 2000 "$response_file" || true
            echo
            exit "$curl_exit"
          fi

          if [[ "$status" != "200" ]]; then
            echo "Payload public API preflight failed: status=$status"
            head -c 2000 "$response_file" || true
            echo
            exit 1
          fi

          if ! jq -e '.docs | type == "array"' "$response_file" >/dev/null; then
            echo "Payload public API preflight returned an unexpected response shape"
            head -c 2000 "$response_file" || true
            echo
            exit 1
          fi
      - name: Payload auth rate limitが429を返すことを確認
        shell: bash
        run: |
          saw_rate_limit=false

          for attempt in {1..15}; do
            status="$(
              curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --output /dev/null \
                --write-out '%{http_code}' \
                --request POST \
                --header 'Accept: application/json' \
                --header 'Content-Type: application/json' \
                --header "Origin: $E2E_BASE_URL" \
                --data '{"email":"netlify-rate-limit-probe@example.invalid","password":"not-a-real-credential-2026"}' \
                "$E2E_BASE_URL/api/users/login"
            )"

            case "$status" in
              400|401|403)
                ;;
              429)
                saw_rate_limit=true
                break
                ;;
              *)
                echo "Payload auth rate limit probe returned an unexpected status: attempt=$attempt status=$status"
                exit 1
                ;;
            esac
          done

          if [[ "$saw_rate_limit" != "true" ]]; then
            echo 'Payload auth rate limit did not return 429 within 15 requests'
            exit 1
          fi
      - name: 実Deploy Previewに対するPlaywright smokeを実行
        run: pnpm test:e2e
