name: Netlify Preview Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: read

jobs:
  preview-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--ivmz-home.netlify.app
      NETLIFY_STATUS_CONTEXT: netlify/ivmz-home/deploy-preview
      PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: 対象commitのDeploy Preview完了を待機
        shell: bash
        run: |
          for attempt in {1..40}; do
            state="$(
              curl --fail --silent --show-error \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$PREVIEW_HEAD_SHA/status" \
                | jq -r --arg context "$NETLIFY_STATUS_CONTEXT" \
                  '[.statuses[] | select(.context == $context)][0].state // "missing"'
            )"

            case "$state" in
              success)
                break
                ;;
              failure|error)
                echo "Deploy Previewが失敗しました: commit=$PREVIEW_HEAD_SHA state=$state"
                exit 1
                ;;
            esac

            if [[ "$attempt" -eq 40 ]]; then
              echo "対象commitのDeploy Preview完了を確認できませんでした: commit=$PREVIEW_HEAD_SHA state=$state"
              exit 1
            fi

            sleep 15
          done

          curl --fail --silent --show-error --location --head "$E2E_BASE_URL" >/dev/null
      - name: 実Deploy Previewに対するPlaywright smokeを実行
        run: pnpm test:e2e
