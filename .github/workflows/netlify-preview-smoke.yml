name: Netlify Preview Smoke

on:
  pull_request:
    branches: [main]
    # PR title edits alone must not trigger a new Preview/Smoke run.
    # During iteration, use [skip netlify]; remove it only after CI is green,
    # then create the final validation commit to get one exact-head Preview.
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve-preview:
    if: ${{ !contains(github.event.pull_request.title, '[skip netlify]') && !contains(github.event.pull_request.title, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.preview.outputs.head_sha }}
      pr_number: ${{ steps.preview.outputs.pr_number }}
    steps:
      - name: Deploy Preview targetを解決
        id: preview
        shell: bash
        run: |
          echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

  preview-smoke:
    needs: resolve-preview
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://deploy-preview-${{ needs.resolve-preview.outputs.pr_number }}--ivmz-home.netlify.app
      NETLIFY_STATUS_CONTEXT: netlify/ivmz-home/deploy-preview
      PREVIEW_HEAD_SHA: ${{ needs.resolve-preview.outputs.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 対象commitのDeploy Preview完了を待機
        shell: bash
        run: |
          for attempt in {1..40}; do
            state="$(
              curl --fail --silent --show-error \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$PREVIEW_HEAD_SHA/status" \
                | jq -r --arg context "$NETLIFY_STATUS_CONTEXT" \
                  '[.statuses[] | select(.context == $context)][0].state // "missing"'
            )"

            case "$state" in
              success)
                break
                ;;
              failure|error)
                echo "Deploy Previewが失敗しました: commit=$PREVIEW_HEAD_SHA state=$state"
                exit 1
                ;;
            esac

            if [[ "$attempt" -eq 40 ]]; then
              echo "対象commitのDeploy Preview完了を確認できませんでした: commit=$PREVIEW_HEAD_SHA state=$state"
              exit 1
            fi

            sleep 15
          done

          curl --fail --silent --show-error --location --head "$E2E_BASE_URL" >/dev/null
      - name: Payload public API preflight
        shell: bash
        run: |
          response_file="$(mktemp)"
          set +e
          status="$(
            curl --silent --show-error --location \
              --connect-timeout 10 \
              --max-time 60 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$E2E_BASE_URL/api/works?limit=1"
          )"
          curl_exit=$?
          set -e

          if [[ "$curl_exit" -ne 0 ]]; then
            echo "Payload public API preflight request failed: curl_exit=$curl_exit status=$status"
            head -c 2000 "$response_file" || true
            echo
            exit "$curl_exit"
          fi

          if [[ "$status" != "200" ]]; then
            echo "Payload public API preflight failed: status=$status"
            head -c 2000 "$response_file" || true
            echo
            exit 1
          fi

          if ! jq -e '.docs | type == "array"' "$response_file" >/dev/null; then
            echo "Payload public API preflight returned an unexpected response shape"
            head -c 2000 "$response_file" || true
            echo
            exit 1
          fi
      - name: Payload auth rate limitが429を返すことを確認
        shell: bash
        run: |
          # Netlifyはcode-based rate limitをdeploy post-processingで検証する。
          # Deploy ready直後の反映差を吸収してから、同一HTTP/2 sessionで連続probeする。
          sleep 15

          node <<'NODE'
          const http2 = require('node:http2')

          const baseURL = new URL(process.env.E2E_BASE_URL)
          const origin = baseURL.origin
          const path = '/api/users/login'
          const body = JSON.stringify({
            email: 'netlify-rate-limit-probe@example.invalid',
            password: 'not-a-real-credential-2026',
          })
          const expectedStatuses = new Set([400, 401, 403])
          const session = http2.connect(origin)

          const requestLogin = () =>
            new Promise((resolve, reject) => {
              let status
              const request = session.request({
                ':method': 'POST',
                ':path': path,
                accept: 'application/json',
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(body),
                origin,
              })

              request.on('response', (headers) => {
                status = Number(headers[':status'])
                request.resume()
              })
              request.on('error', reject)
              request.on('end', () => resolve(status))
              request.end(body)
            })

          const run = async () => {
            let sawRateLimit = false

            for (let attempt = 1; attempt <= 15; attempt += 1) {
              const status = await requestLogin()

              if (status === 429) {
                console.log(`Payload auth rate limit returned 429: attempt=${attempt}`)
                sawRateLimit = true
                break
              }

              if (!expectedStatuses.has(status)) {
                throw new Error(
                  `Payload auth rate limit probe returned an unexpected status: attempt=${attempt} status=${status}`,
                )
              }
            }

            if (!sawRateLimit) {
              throw new Error('Payload auth rate limit did not return 429 within 15 same-connection requests')
            }
          }

          run()
            .then(() => session.close())
            .catch((error) => {
              session.destroy()
              console.error(error instanceof Error ? error.message : error)
              process.exit(1)
            })
          NODE
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: 実Deploy Previewに対するPlaywright smokeを実行
        run: pnpm test:e2e
