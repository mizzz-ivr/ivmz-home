name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ivmz_home
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ivmz_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/ivmz_home
      PAYLOAD_ALLOWED_ORIGINS: http://127.0.0.1:3000
      PAYLOAD_PUBLIC_SERVER_URL: http://127.0.0.1:3000
      PAYLOAD_SECRET: ci-only-secret-not-for-production-2026-ivmz-home
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - name: 匿名投稿の実PostgreSQL並列制御と冪等性を検証
        env:
          ANONYMOUS_DB_INTEGRATION: 'true'
        run: pnpm exec vitest run src/messages/store.integration.test.ts
      - name: 匿名投稿の専用DBマイグレーションをdown→up検証
        env:
          ANONYMOUS_DB_ROLLBACK: 'true'
        run: pnpm exec vitest run src/messages/rollback.integration.test.ts
      - name: 匿名投稿の管理者公開承認・非公開化・監査の実DB検証
        env:
          ANONYMOUS_PUBLICATION_DB_INTEGRATION: 'true'
        run: pnpm exec vitest run src/messages/publication-admin.integration.test.ts
      - name: 匿名投稿の公開→撤回→再公開と旧共有URL無効化を実DB検証
        env:
          ANONYMOUS_PUBLIC_READER_DB_INTEGRATION: 'true'
        run: pnpm exec vitest run src/messages/public-reader.integration.test.ts
      - run: pnpm generate:types
      - run: pnpm generate:importmap
      - name: 生成済みPayload成果物がコミットされていることを確認
        shell: bash
        run: git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
      - run: pnpm build

  # Browser tests against a local production build, so iteration on a pull request does not need a
  # Netlify Deploy Preview (each preview build spends Netlify credits). The Deploy Preview smoke
  # test still runs once on the final commit of a pull request and covers what only Netlify
  # provides (headers, rate limits, the real deploy pipeline).
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ivmz_home
          POSTGRES_PASSWORD: payload
          POSTGRES_USER: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d ivmz_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://payload:payload@127.0.0.1:5432/ivmz_home
      PAYLOAD_ALLOWED_ORIGINS: http://127.0.0.1:3000
      PAYLOAD_PUBLIC_SERVER_URL: http://127.0.0.1:3000
      PAYLOAD_SECRET: ci-only-secret-not-for-production-2026-ivmz-home
      E2E_BASE_URL: http://127.0.0.1:3000
      # Behave like a Netlify Deploy Preview: no real mail is sent and the bot check is off, which
      # is what the contact form tests expect.
      CONTEXT: deploy-preview
      DEPLOY_PRIME_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the production server
        run: |
          nohup pnpm start > server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then exit 0; fi
            sleep 2
          done
          cat server.log
          exit 1
      - name: Browser tests (Chromium)
        run: pnpm exec playwright test --project=chromium
      - name: 承認済み共有SSR・OG・公開撤回を隔離CIのHTTPで検証
        env:
          ANONYMOUS_PUBLIC_HTTP_DB_INTEGRATION: 'true'
          ANONYMOUS_PUBLIC_HTTP_BASE_URL: http://127.0.0.1:3100
        shell: bash
        run: |
          set -euo pipefail
          PORT=3100 ANONYMOUS_MESSAGE_PUBLIC_PAGES_ENABLED=true pnpm start > server-public.log 2>&1 &
          public_server_pid=$!
          trap 'kill "$public_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3100/; then break; fi
            if [ "$attempt" -eq 45 ]; then cat server-public.log; exit 1; fi
            sleep 2
          done
          pnpm exec vitest run src/messages/public-http.integration.test.ts
      - name: Public server log on failure
        if: failure()
        run: tail -n 100 server-public.log || true
      - name: Server log on failure
        if: failure()
        run: tail -n 100 server.log || true
