name: Temporary formatter diff for Issue 69 DB test
on:
  push:
    branches:
      - test/issue69-postgres-concurrent-submissions
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/messages/store.integration.test.ts
      - name: Print formatter diff
        run: git diff -- src/messages/store.integration.test.ts
