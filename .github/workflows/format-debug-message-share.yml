name: Temporary formatter diff (sharing)
on:
  push:
    branches:
      - feat/issue69-approved-message-share
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write 'src/app/(site)/message/[publicId]/opengraph-image.tsx' 'src/app/(site)/message/[publicId]/page.tsx' 'tests/e2e/anonymous-message-public.spec.ts'
      - run: git diff -- 'src/app/(site)/message/[publicId]/opengraph-image.tsx' 'src/app/(site)/message/[publicId]/page.tsx' 'tests/e2e/anonymous-message-public.spec.ts'
