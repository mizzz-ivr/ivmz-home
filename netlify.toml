[context.production]
  command = "node scripts/assert-production-database.mjs && pnpm build"
  ignore = "node ./scripts/netlify-ignore-production.mjs"

[context.production.environment]
  PAYLOAD_PREVIEW_DATABASE_HOST = "pg-relay.ivrm.jp"
  PAYLOAD_PREVIEW_DATABASE_NAME = "ivmz_home_preview"
  PAYLOAD_PRODUCTION_DATABASE_HOST = "pg-relay.ivrm.jp"
  PAYLOAD_PRODUCTION_DATABASE_NAME = "ivmz_home"

[context.deploy-preview]
  command = "node scripts/assert-preview-database.mjs && pnpm build"

[context.deploy-preview.environment]
  PAYLOAD_PREVIEW_DATABASE_HOST = "pg-relay.ivrm.jp"
  PAYLOAD_PREVIEW_DATABASE_NAME = "ivmz_home_preview"
  PAYLOAD_PRODUCTION_DATABASE_HOST = "pg-relay.ivrm.jp"
  PAYLOAD_PRODUCTION_DATABASE_NAME = "ivmz_home"

[context.branch-deploy]
  command = "node scripts/assert-preview-database.mjs && pnpm build"

[context.branch-deploy.environment]
  PAYLOAD_PREVIEW_DATABASE_HOST = "pg-relay.ivrm.jp"
  PAYLOAD_PREVIEW_DATABASE_NAME = "ivmz_home_preview"
  PAYLOAD_PRODUCTION_DATABASE_HOST = "pg-relay.ivrm.jp"
  PAYLOAD_PRODUCTION_DATABASE_NAME = "ivmz_home"
