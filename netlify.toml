# Keep Payload auth abuse protection in Netlify's request-security stage instead of
# introducing a pass-through Edge Function solely to attach the rate-limit rule.
[[redirects]]
  from = "/api/users/login"
  to = "/api/users/login"

  [redirects.rate_limit]
    action = "rate_limit"
    window_limit = 10
    window_size = 60
    aggregate_by = ["ip", "domain"]
